<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="glow3_2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9eff5c" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#7FD049" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7FD049" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="targetGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7FD049" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow3_2">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7FD049" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Core Glow -->
  <circle cx="60" cy="60" r="46" fill="url(#glow3_2)"/>

  <!-- Outer Glass Diamond Base -->
  <rect x="25" y="25" width="70" height="70" rx="18" transform="rotate(45 60 60)" fill="url(#targetGlass)" stroke="#ffffff" stroke-width="2" filter="url(#shadow3_2)"/>

  <!-- Inner Target Circles -->
  <circle cx="60" cy="60" r="26" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="16" fill="none" stroke="#9eff5c" stroke-width="3"/>
  <circle cx="60" cy="60" r="8" fill="#9eff5c"/>
  <circle cx="60" cy="60" r="4" fill="#ffffff"/>

  <!-- Target Aim Lines -->
  <line x1="60" y1="28" x2="60" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="60" y2="92" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="60" x2="40" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="60" x2="92" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>