<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="bgGlow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="innerGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#006EA7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="rimGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="38" fill="none" stroke="#006EA7" stroke-width="6" opacity="0.25" filter="url(#bgGlow1)" />
  <circle cx="50" cy="50" r="36" fill="url(#blueGrad1)" fill-opacity="0.3" stroke="url(#rimGrad1)" stroke-width="2.5" />

  <!-- Main 4-Point Sparkle -->
  <path d="M 50 20 Q 50 50 20 50 Q 50 50 50 80 Q 50 50 80 50 Q 50 50 50 20 Z" fill="url(#blueGrad1)" stroke="#ffffff" stroke-width="1.8" filter="url(#innerGlow1)" />
  <path d="M 50 32 Q 50 50 32 50 Q 50 50 50 68 Q 50 50 68 50 Q 50 50 50 32 Z" fill="#ffffff" opacity="0.9" />

  <!-- Secondary Top Right Sparkle -->
  <path d="M 72 22 Q 72 36 58 36 Q 72 36 72 50 Q 72 36 86 36 Q 72 36 72 22 Z" fill="url(#blueGrad1)" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
  <path d="M 72 28 Q 72 36 64 36 Q 72 36 72 44 Q 72 36 80 36 Q 72 36 72 28 Z" fill="#ffffff" opacity="0.95" />

  <!-- Small Bottom Left Sparkle -->
  <path d="M 28 66 Q 28 75 19 75 Q 28 75 28 84 Q 28 75 37 75 Q 28 75 28 66 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
</svg>