<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Glow Aura -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#006EA7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Large Sparkle Gradient -->
    <linearGradient id="mainSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#006EA7"/>
      <stop offset="100%" stop-color="#006EA7"/>
    </linearGradient>

    <!-- Small Sparkle Gradient -->
    <linearGradient id="smallSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#006EA7"/>
    </linearGradient>

    <!-- 3D Shadow -->
    <filter id="sparkleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#006EA7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Glowing Aura -->
  <circle cx="65" cy="58" r="48" fill="url(#sparkleGlow)"/>

  <!-- Main Large Four-Pointed Sparkle (Right-Center) -->
  <path d="M 68,14 C 70,36 78,44 102,48 C 78,52 70,60 68,92 C 64,60 56,52 34,48 C 56,44 64,36 68,14 Z" 
        fill="url(#mainSparkleGrad)" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        filter="url(#sparkleShadow)"/>

  <!-- Top-Left Small Sparkle -->
  <path d="M 38,16 C 39,26 43,30 54,32 C 43,34 39,38 38,50 C 36,38 32,34 22,32 C 32,30 36,26 38,16 Z" 
        fill="url(#smallSparkleGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2"/>

  <!-- Bottom-Left Small Sparkle -->
  <path d="M 34,60 C 35,70 39,73 48,75 C 39,77 35,81 34,92 C 32,81 28,77 18,75 C 28,73 32,70 34,60 Z" 
        fill="url(#smallSparkleGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2"/>

  <!-- Highlights & Glossy Specular Refection -->
  <circle cx="68" cy="48" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="68" cy="48" r="9" fill="#38bdf8" opacity="0.6"/>
</svg>