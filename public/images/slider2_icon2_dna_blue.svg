<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="bgGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="innerGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="rimGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="38" fill="none" stroke="#006EA7" stroke-width="6" opacity="0.25" filter="url(#bgGlow2)" />
  <circle cx="50" cy="50" r="36" fill="url(#blueGrad2)" fill-opacity="0.3" stroke="url(#rimGrad2)" stroke-width="2.5" />

  <!-- Shield Shape -->
  <path d="M 50 18 L 76 28 C 76 56, 50 78, 50 78 C 50 78, 24 56, 24 28 Z" fill="url(#blueGrad2)" fill-opacity="0.2" stroke="url(#rimGrad2)" stroke-width="2" />

  <!-- DNA Strand 1 -->
  <path d="M 36 28 C 64 38, 64 62, 36 72" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#innerGlow2)" />
  <!-- DNA Strand 2 -->
  <path d="M 64 28 C 36 38, 36 62, 64 72" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#innerGlow2)" />

  <!-- DNA Connectors -->
  <line x1="42" y1="36" x2="58" y2="36" stroke="#ffffff" stroke-width="2" />
  <line x1="38" y1="50" x2="62" y2="50" stroke="#006EA7" stroke-width="2.5" />
  <line x1="42" y1="64" x2="58" y2="64" stroke="#ffffff" stroke-width="2" />

  <!-- Center Core Sparkle -->
  <circle cx="50" cy="50" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#innerGlow2)" />
</svg>