<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="bgGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="innerGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blueGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="rimGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="38" fill="none" stroke="#006EA7" stroke-width="6" opacity="0.25" filter="url(#bgGlow3)" />
  <circle cx="50" cy="50" r="36" fill="url(#blueGrad3)" fill-opacity="0.3" stroke="url(#rimGrad3)" stroke-width="2.5" />

  <!-- Outer Sun Rays -->
  <line x1="50" y1="14" x2="50" y2="22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="78" x2="50" y2="86" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="50" x2="22" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="78" y1="50" x2="86" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="24" y1="24" x2="30" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="70" x2="76" y2="76" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="30" x2="76" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="76" x2="30" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing Waterdrop / Lotus Leaf -->
  <path d="M 50 26 Q 70 52 50 74 Q 30 52 50 26 Z" fill="url(#blueGrad3)" stroke="#ffffff" stroke-width="2" filter="url(#innerGlow3)" />
  <path d="M 50 36 Q 62 54 50 68 Q 38 54 50 36 Z" fill="#ffffff" opacity="0.9" />
</svg>