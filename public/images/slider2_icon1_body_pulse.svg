<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="glow2_1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9eff5c" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7FD049" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7FD049" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass2_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7FD049" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow2_1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7FD049" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="60" cy="60" r="45" fill="url(#glow2_1)"/>

  <!-- Glass Orbit Ring -->
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="#9eff5c" stroke-width="3" stroke-dasharray="10 6" opacity="0.8" transform="rotate(-25 60 60)"/>

  <!-- Main 3D Sphere -->
  <circle cx="60" cy="60" r="32" fill="url(#glass2_1)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow2_1)"/>
  
  <!-- Inner Glowing Core -->
  <circle cx="60" cy="60" r="16" fill="#9eff5c" opacity="0.9"/>
  <circle cx="60" cy="60" r="10" fill="#ffffff"/>

  <!-- Pulse Line Wave -->
  <path d="M38 60 L48 60 L53 48 L60 74 L67 52 L72 60 L82 60" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 60 L48 60 L53 48 L60 74 L67 52 L72 60 L82 60" fill="none" stroke="#7FD049" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glass Specular Reflection -->
  <ellipse cx="50" cy="42" rx="14" ry="7" fill="#ffffff" opacity="0.5" transform="rotate(-30 50 42)"/>
</svg>